<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literature Finder (MVP)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .form-group textarea { height: 100px; resize: vertical; }
        .btn-ai { background-color: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-ai:disabled { background-color: #6c757d; cursor: not-allowed; }
        .btn-submit { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .paper-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 6px; background-color: #fcfcfc; }
        .btn-delete { background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>📚 Literature Finder</h1>
    <p>生醫與 AI 文獻管理系統</p>
    <hr>

    <form id="paper-form">
        <div class="form-group">
            <label for="title">1. 論文名稱 <span style="color:red;">*</span></label>
            <input type="text" id="title" placeholder="例如: Attention Is All You Need" required>
        </div>

        <div class="form-group">
            <label for="authors">2. 作者</label>
            <input type="text" id="authors" placeholder="例如: Ashish Vaswani, et al.">
        </div>

        <div class="form-group">
            <label for="journal">3. 出版刊物</label>
            <input type="text" id="journal" placeholder="例如: NeurIPS / Nature / bioRxiv">
        </div>

        <div class="form-group">
            <label for="pub_date">4. 發布日期</label>
            <input type="date" id="pub_date">
        </div>

        <div class="form-group">
            <label for="abstract">6. 研究相關內容 / 摘要</label>
            <textarea id="abstract" placeholder="請輸入論文內文或摘要..."></textarea>
        </div>

        <div class="form-group" style="background-color: #e9f7ef; padding: 12px; border-radius: 6px; border: 1px solid #c3e6cb;">
            <button type="button" id="btn-ai-analyze" class="btn-ai">🤖 AI 一鍵分析 (自動評分與摘要)</button>
            <span id="ai-loading-status" style="margin-left: 10px; color: #155724; font-weight: bold; display: none;">⏳ AI 分析中，請稍候...</span>
        </div>

        <div class="form-group">
            <label for="relevance_score">5. (AI判斷)相關度評分 (0-10)</label>
            <input type="number" id="relevance_score" min="0" max="10" step="0.1" placeholder="點擊上方按鈕自動生成，或自行手動輸入">
        </div>

        <button type="submit" class="btn-submit">新增文獻</button>
    </form>

    <hr>
    <h2>📋 已存文獻列表</h2>
    <div id="paper-list"></div>

    <script src="app.js"></script>
</body>
</html>
